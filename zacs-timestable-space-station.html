<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zac's Timestable Space Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --void:#0B0E23;
  --void-2:#080A1A;
  --hull:#171C3D;
  --hull-lit:#222A55;
  --plasma:#2BF5C8;
  --plasma-deep:#0E9C7E;
  --solar:#FFB020;
  --magenta:#FF3D8A;
  --star:#EAF0FF;
  --dim:#7C85B8;
  --edge:rgba(124,133,184,.32);
  --chamf:14px;
  --display:'Bungee','Impact','Arial Black',sans-serif;
  --body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --data:'Chakra Petch','Consolas',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--star);
  font-family:var(--body);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
#sky{position:fixed;inset:0;z-index:0;display:block}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(43,245,200,.10), transparent 60%),
    radial-gradient(100% 70% at 50% 115%, rgba(255,176,32,.09), transparent 60%);
}
.scan{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 4px);
}

/* ---------- shell ---------- */
#app{
  position:relative;z-index:3;
  height:100dvh;height:100vh;
  display:flex;flex-direction:column;
  padding:max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  max-width:620px;margin:0 auto;
  gap:12px;
}
@supports (height:100dvh){#app{height:100dvh}}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:12px}
.screen.on{display:flex}

.chamf{clip-path:polygon(var(--chamf) 0,100% 0,100% calc(100% - var(--chamf)),calc(100% - var(--chamf)) 100%,0 100%,0 var(--chamf))}
.chamf-all{clip-path:polygon(var(--chamf) 0,calc(100% - var(--chamf)) 0,100% var(--chamf),100% calc(100% - var(--chamf)),calc(100% - var(--chamf)) 100%,var(--chamf) 100%,0 calc(100% - var(--chamf)),0 var(--chamf))}

.panel{background:var(--hull);border:1px solid var(--edge)}

/* ---------- launch pad ---------- */
.brand{text-align:center;flex:0 0 auto}
.brand .zac{
  font-family:var(--display);
  font-size:clamp(1.5rem,7.4vw,2.5rem);
  line-height:.98;letter-spacing:.5px;
  color:var(--solar);
  text-shadow:0 3px 0 #7a4a00, 0 0 26px rgba(255,176,32,.45);
  margin:0;
}
.brand .sub{
  font-family:var(--display);
  font-size:clamp(.78rem,3.5vw,1.12rem);
  color:var(--plasma);
  letter-spacing:1px;
  text-shadow:0 2px 0 #06463a,0 0 20px rgba(43,245,200,.4);
  margin:4px 0 0;
}
.brand .tag{
  font-family:var(--data);font-weight:500;
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin:7px 0 0;
}

.homescroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.block{padding:12px}
.block h2{
  font-family:var(--data);font-weight:700;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin:0 0 9px;
  display:flex;align-items:center;gap:8px;
}
.block h2::after{content:"";flex:1;height:1px;background:var(--edge)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tbtn{
  appearance:none;border:1px solid var(--edge);background:var(--hull-lit);
  color:var(--star);font-family:var(--display);
  font-size:clamp(1rem,4.6vw,1.3rem);
  padding:12px 0 13px;cursor:pointer;position:relative;
  transition:transform .08s ease, background .12s ease;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.tbtn:active{transform:translateY(2px)}
.tbtn[aria-pressed="true"]{
  background:var(--plasma);color:#04261F;border-color:var(--plasma);
  box-shadow:0 0 22px rgba(43,245,200,.5);
}
.tbtn .mini{display:block;font-family:var(--data);font-size:.52rem;letter-spacing:.12em;color:var(--dim);margin-top:2px}
.tbtn[aria-pressed="true"] .mini{color:#04261F}

.tbtn.twelve{grid-column:span 2}
.wide{grid-column:span 2;font-size:clamp(.8rem,3.4vw,.95rem);padding:11px 4px 12px;line-height:1.15}

.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--hull-lit);border:1px solid var(--edge);padding:9px 11px;cursor:pointer;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.opt > span:first-child{text-align:left}
.opt .lab{font-weight:600;font-size:.92rem;display:block}
.opt .hint{display:block;font-family:var(--data);font-weight:500;font-size:.64rem;color:var(--dim);letter-spacing:.05em;margin-top:1px}
.sw{
  flex:0 0 auto;width:52px;height:28px;background:#0C1030;border:1px solid var(--edge);
  position:relative;transition:background .15s ease;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.sw::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--dim);
  transition:transform .15s cubic-bezier(.3,1.5,.5,1), background .15s ease;
}
.opt[aria-pressed="true"] .sw{background:rgba(43,245,200,.2);border-color:var(--plasma)}
.opt[aria-pressed="true"] .sw::after{transform:translateX(24px);background:var(--plasma)}
.opt:focus-visible,.tbtn:focus-visible,.key:focus-visible,.cta:focus-visible,.ghost:focus-visible{outline:3px solid var(--solar);outline-offset:2px}

.cta{
  flex:0 0 auto;appearance:none;border:0;cursor:pointer;width:100%;
  font-family:var(--display);font-size:clamp(1.15rem,5.4vw,1.55rem);
  padding:17px 10px 19px;color:#04261F;
  background:linear-gradient(180deg,#5CFFDA,#12C69F);
  box-shadow:0 6px 0 #07705B, 0 0 34px rgba(43,245,200,.34);
  transition:transform .07s ease, box-shadow .07s ease;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%,0 16px);
}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #07705B,0 0 20px rgba(43,245,200,.3)}
.cta.gold{background:linear-gradient(180deg,#FFD37A,#F09000);box-shadow:0 6px 0 #8A5200,0 0 34px rgba(255,176,32,.3);color:#331D00}
.ghost{
  appearance:none;cursor:pointer;width:100%;
  background:transparent;border:1px solid var(--edge);color:var(--dim);
  font-family:var(--data);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:.72rem;padding:12px 10px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.ghost:active{background:var(--hull-lit)}

.nail{display:flex;flex-wrap:wrap;gap:6px}
.nailchip{
  font-family:var(--data);font-weight:700;font-size:.82rem;
  background:rgba(255,61,138,.13);border:1px solid rgba(255,61,138,.5);color:#FFA9CB;
  padding:5px 9px;letter-spacing:.03em;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.nailchip.clean{background:rgba(43,245,200,.12);border-color:rgba(43,245,200,.45);color:var(--plasma)}

/* ---------- mission HUD ---------- */
.hud{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.hudrow{display:flex;align-items:stretch;gap:7px}
.stat{
  flex:1;background:var(--hull);border:1px solid var(--edge);padding:6px 8px 7px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.stat .k{font-family:var(--data);font-weight:500;font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--data);font-weight:700;font-size:1.12rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.sc .v{color:var(--solar)}
.stat.ac .v{color:var(--plasma)}
.stat.st .v{color:var(--star)}
.stat.st.hot{border-color:var(--solar);background:rgba(255,176,32,.12)}
.stat.st.hot .v{color:var(--solar)}
.quit{
  flex:0 0 auto;width:42px;background:var(--hull);border:1px solid var(--edge);color:var(--dim);
  font-family:var(--data);font-weight:700;font-size:1rem;cursor:pointer;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pip{height:7px;background:#0C1030;border:1px solid var(--edge)}
.pip.ok{background:var(--plasma);border-color:var(--plasma);box-shadow:0 0 9px rgba(43,245,200,.55)}
.pip.no{background:var(--magenta);border-color:var(--magenta);box-shadow:0 0 9px rgba(255,61,138,.5)}
.pip.now{background:var(--solar);border-color:var(--solar);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.fuse{height:6px;background:#0C1030;border:1px solid var(--edge);overflow:hidden;display:none}
.fuse.on{display:block}
.fuse i{display:block;height:100%;background:linear-gradient(90deg,var(--plasma),var(--solar));width:100%;transform-origin:left center}

/* ---------- porthole ---------- */
.port{
  flex:1;min-height:0;position:relative;
  background:linear-gradient(180deg,rgba(20,25,56,.74),rgba(13,17,40,.86));
  border:1px solid var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px;gap:6px;overflow:hidden;
}
.port::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 42%,rgba(43,245,200,.12),transparent 70%);
}
.port.good{animation:snapgood .34s ease-out}
.port.bad{animation:snapbad .34s ease-out}
@keyframes snapgood{0%{background:rgba(15,92,76,.95)}30%{background:rgba(15,92,76,.95)}100%{background:linear-gradient(180deg,rgba(20,25,56,.74),rgba(13,17,40,.86))}}
@keyframes snapbad{0%{background:rgba(92,19,56,.95);transform:translateX(-5px)}25%{transform:translateX(5px)}50%{transform:translateX(-3px)}100%{background:linear-gradient(180deg,rgba(20,25,56,.74),rgba(13,17,40,.86));transform:none}}

.eq{
  font-family:var(--body);font-weight:700;
  font-size:clamp(2.6rem,13vw,4.6rem);line-height:1;
  letter-spacing:-1px;display:flex;align-items:baseline;gap:.12em;
  font-variant-numeric:tabular-nums;position:relative;
}
.eq .x{color:var(--plasma);font-size:.72em}
.slot{
  min-width:2.6ch;min-height:1.1em;padding:2px 10px;
  background:rgba(11,14,35,.85);border-bottom:5px solid var(--solar);
  color:var(--solar);text-align:center;
}
.slot.empty{color:rgba(255,176,32,.4)}
.caret{display:inline-block;width:3px;height:.8em;background:var(--solar);animation:blink 1s steps(1) infinite;vertical-align:-.04em;margin-left:1px}
@keyframes blink{50%{opacity:0}}

.msg{
  position:relative;font-family:var(--display);
  font-size:clamp(.85rem,4vw,1.15rem);text-align:center;min-height:1.4em;
  letter-spacing:.5px;
}
.msg.good{color:var(--plasma);text-shadow:0 0 18px rgba(43,245,200,.6)}
.msg.bad{color:#FF8FBA}
.msg .fact{display:block;font-family:var(--body);font-weight:600;font-size:1.5em;color:var(--star);margin-top:6px;letter-spacing:0}
.msg .why{display:block;font-family:var(--data);font-weight:500;font-size:.72em;color:var(--dim);letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
.combo{
  position:absolute;top:10px;right:12px;
  font-family:var(--display);font-size:clamp(.7rem,3.2vw,.9rem);color:var(--solar);
  opacity:0;transform:translateY(6px);
}
.combo.show{animation:pop .8s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.12)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* ---------- keypad ---------- */
.pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{
  appearance:none;border:1px solid var(--edge);background:var(--hull-lit);color:var(--star);
  font-family:var(--data);font-weight:700;
  font-size:clamp(1.3rem,6vw,1.8rem);
  padding:clamp(11px,2.6vh,17px) 0;cursor:pointer;
  box-shadow:0 4px 0 #0A0D24;
  transition:transform .06s ease, box-shadow .06s ease, background .1s ease;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.key:active{transform:translateY(4px);box-shadow:0 0 0 #0A0D24;background:#2C3670}
.key.del{color:var(--magenta);font-size:clamp(1.45rem,6.6vw,2rem);line-height:.85}
.key.go{
  background:linear-gradient(180deg,#5CFFDA,#12C69F);color:#04261F;
  box-shadow:0 4px 0 #07705B;font-family:var(--display);
  font-size:clamp(.95rem,4.4vw,1.25rem);
}
.key.go:active{box-shadow:0 0 0 #07705B}
.key[disabled]{opacity:.35;pointer-events:none}

/* ---------- debrief ---------- */
.rank{text-align:center;padding:14px 12px 16px}
.rank .badge{font-size:clamp(2.6rem,13vw,4rem);line-height:1}
.rank .title{font-family:var(--display);font-size:clamp(1.1rem,5.4vw,1.6rem);color:var(--solar);margin:6px 0 0;text-shadow:0 2px 0 #7a4a00}
.rank .line{font-family:var(--body);font-weight:500;font-size:.92rem;color:var(--star);margin:7px 0 0;opacity:.9}
.bigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.big{background:var(--hull);border:1px solid var(--edge);padding:11px 6px 12px;text-align:center;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
.big .v{font-family:var(--data);font-weight:700;font-size:clamp(1.3rem,6.4vw,1.8rem);line-height:1;font-variant-numeric:tabular-nums}
.big .k{font-family:var(--data);font-weight:500;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.big.a .v{color:var(--plasma)}
.big.b .v{color:var(--solar)}
.big.c .v{color:var(--star)}
.newbest{
  font-family:var(--display);font-size:.78rem;color:var(--solar);text-align:center;
  letter-spacing:1px;padding:7px;background:rgba(255,176,32,.12);border:1px dashed rgba(255,176,32,.5);
}
.rlist{display:flex;flex-direction:column;gap:5px}
.rrow{
  display:flex;align-items:center;gap:9px;padding:6px 9px;
  background:var(--hull-lit);border-left:4px solid var(--plasma);
  font-family:var(--data);font-weight:700;font-size:.92rem;
}
.rrow.miss{border-left-color:var(--magenta)}
.rrow .q{flex:1;font-variant-numeric:tabular-nums}
.rrow .got{font-size:.72rem;color:var(--dim);font-weight:500}
.rrow .tick{font-size:.95rem}
.actions{flex:0 0 auto;display:flex;flex-direction:column;gap:7px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

</head>
<body>
<canvas id="sky"></canvas>
<div class="veil"></div>
<div class="scan"></div>

<div id="app">

  <!-- ============ LAUNCH PAD ============ -->
  <section id="s-home" class="screen on">
    <header class="brand">
      <h1 class="zac">ZAC'S TIMESTABLE</h1>
      <p class="sub">SPACE STATION</p>
      <p class="tag">10 questions &middot; up to 12 &times; 12</p>
    </header>

    <div class="homescroll">
      <div class="panel chamf block">
        <h2>Pick your mission</h2>
        <div class="grid" id="tables"></div>
      </div>

      <div class="panel chamf block">
        <h2>Flight settings</h2>
        <div class="opts">
          <button class="opt" id="opt-turbo" aria-pressed="false">
            <span><span class="lab">Turbo timer</span><span class="hint">6 seconds a question &mdash; like the Year 4 check</span></span>
            <span class="sw"></span>
          </button>
          <button class="opt" id="opt-flip" aria-pressed="true">
            <span><span class="lab">Flip it round</span><span class="hint">Asks 12 &times; 3 and 3 &times; 12</span></span>
            <span class="sw"></span>
          </button>
          <button class="opt" id="opt-sound" aria-pressed="true">
            <span><span class="lab">Sound</span><span class="hint">Bleeps and blasts</span></span>
            <span class="sw"></span>
          </button>
        </div>
      </div>

      <div class="panel chamf block" id="nailblock">
        <h2>Facts to nail</h2>
        <div class="nail" id="nail"></div>
      </div>
    </div>

    <button class="cta chamf-all" id="launch">LAUNCH &#9654;</button>
  </section>

  <!-- ============ MISSION ============ -->
  <section id="s-play" class="screen">
    <div class="hud">
      <div class="hudrow">
        <div class="stat sc chamf"><div class="k">Score</div><div class="v" id="hScore">0</div></div>
        <div class="stat ac chamf"><div class="k">Accuracy</div><div class="v" id="hAcc">&mdash;</div></div>
        <div class="stat st chamf" id="hStreakBox"><div class="k">Streak</div><div class="v" id="hStreak">0</div></div>
        <button class="quit" id="abort" aria-label="Leave mission">&#10005;</button>
      </div>
      <div class="pips" id="pips"></div>
      <div class="fuse" id="fuse"><i id="fuseBar"></i></div>
    </div>

    <div class="port chamf-all" id="port">
      <div class="combo" id="combo"></div>
      <div class="eq" id="eq"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
    </div>

    <div class="pad" id="pad"></div>
  </section>

  <!-- ============ DEBRIEF ============ -->
  <section id="s-done" class="screen">
    <div class="homescroll">
      <div class="panel chamf-all rank">
        <div class="badge" id="dBadge">&#128640;</div>
        <p class="title" id="dTitle">ASTRONAUT</p>
        <p class="line" id="dLine"></p>
      </div>

      <div class="bigrow">
        <div class="big a chamf"><div class="v" id="dAcc">0%</div><div class="k">Accuracy</div></div>
        <div class="big b chamf"><div class="v" id="dScore">0</div><div class="k">Score</div></div>
        <div class="big c chamf"><div class="v" id="dSpeed">0s</div><div class="k">Avg speed</div></div>
      </div>

      <div class="newbest chamf" id="dBest" hidden></div>

      <div class="panel chamf block">
        <h2 id="dListHead">Mission log</h2>
        <div class="rlist" id="dList"></div>
      </div>
    </div>

    <div class="actions">
      <button class="cta gold chamf-all" id="fixit" hidden>FIX THE MISSED ONES</button>
      <button class="cta chamf-all" id="again">FLY AGAIN</button>
      <button class="ghost" id="home">CHANGE MISSION</button>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------
   Zac's Timestable Space Station
   UK Year 4 (age 8-9): recall facts up to 12 x 12.
   Design notes baked into the rules:
   - Multipliers run 2..12, not 1..12. "x1" is not a fact
     worth one of ten slots and inflates accuracy.
   - Facts are sampled WITHOUT replacement, so a 10-question
     round never repeats itself.
   - One attempt per question: accuracy has to mean something.
     Missed facts come back in an optional Fix-It round that
     does not touch the recorded score.
--------------------------------------------------------- */

var STORE='zac_tss_v1';
var LOW=2, HIGH=12, ROUND=10;
var BOSS=[6,7,8,9,11,12];

var el=function(id){return document.getElementById(id);};

/* ---------- persistence (never let it break the game) ---------- */
function load(){
  try{
    var raw=localStorage.getItem(STORE);
    if(!raw) throw 0;
    var d=JSON.parse(raw);
    return {best:d.best||{}, errs:d.errs||{}, seen:d.seen||{}};
  }catch(e){ return {best:{}, errs:{}, seen:{}}; }
}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(DB)); }catch(e){} }
var DB=load();

/* ---------- state ---------- */
var S={
  mission:'random',   // '2'..'12' | 'random' | 'boss'
  turbo:false,
  flip:true,
  sound:true,
  qs:[], i:0, entry:'',
  score:0, correct:0, streak:0, best:0,
  startedAt:0, elapsed:0,
  locked:false, fixing:false,
  timer:null, deadline:0
};

/* ---------- sound (WebAudio, no assets) ---------- */
var AC=null;
function ac(){
  if(!S.sound) return null;
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq,dur,type,vol,when){
  var c=ac(); if(!c) return;
  var t=c.currentTime+(when||0);
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.02);
}
var SFX={
  tap:function(){ tone(680,0.05,'square',0.07); },
  del:function(){ tone(240,0.07,'square',0.07); },
  good:function(n){ var b=520+Math.min(n,6)*50; tone(b,0.1,'square',0.14); tone(b*1.5,0.14,'square',0.11,0.07); },
  bad:function(){ tone(200,0.16,'sawtooth',0.10); tone(150,0.22,'sawtooth',0.09,0.1); },
  launch:function(){ tone(300,0.1,'square',0.12); tone(450,0.1,'square',0.12,0.09); tone(700,0.2,'square',0.12,0.18); },
  fanfare:function(){ [523,659,784,1047].forEach(function(f,k){ tone(f,0.28,'triangle',0.15,k*0.11); }); },
  tick:function(){ tone(900,0.03,'square',0.05); }
};
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ---------- starfield ---------- */
(function sky(){
  var cv=el('sky'), cx=cv.getContext('2d'), stars=[], w=0, h=0,
      calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    w=cv.clientWidth; h=cv.clientHeight;
    cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(w*h/5200);
    stars=[];
    for(var k=0;k<n;k++){
      var layer=k%3;
      stars.push({x:Math.random()*w, y:Math.random()*h,
        r:0.5+layer*0.65, v:0.05+layer*0.16,
        c:layer===2?'rgba(43,245,200,':(layer===1?'rgba(234,240,255,':'rgba(124,133,184,'),
        a:0.25+layer*0.22});
    }
  }
  function frame(){
    cx.clearRect(0,0,w,h);
    for(var k=0;k<stars.length;k++){
      var s=stars[k];
      if(!calm){ s.y+=s.v; if(s.y>h+2){ s.y=-2; s.x=Math.random()*w; } }
      cx.fillStyle=s.c+s.a+')';
      cx.fillRect(s.x,s.y,s.r,s.r*(calm?1:2.2));
    }
    if(!calm) requestAnimationFrame(frame);
  }
  fit(); frame();
  window.addEventListener('resize',function(){ fit(); if(calm) frame(); });
})();

/* ---------- helpers ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function factKey(a,b){ var lo=Math.min(a,b), hi=Math.max(a,b); return lo+'x'+hi; }
function range(lo,hi){ var r=[]; for(var i=lo;i<=hi;i++) r.push(i); return r; }
function screenTo(name){
  ['home','play','done'].forEach(function(n){ el('s-'+n).classList.toggle('on', n===name); });
}

/* ---------- question building ---------- */
function buildRound(){
  var pairs=[], k;
  if(S.mission==='random' || S.mission==='boss'){
    var firsts = S.mission==='boss' ? BOSS : range(LOW,HIGH);
    var pool=[], used={};
    for(var i=0;i<firsts.length;i++){
      for(var j=LOW;j<=HIGH;j++){
        var key=factKey(firsts[i],j);
        if(used[key]) continue;
        used[key]=1; pool.push([firsts[i],j]);
      }
    }
    pairs=shuffle(pool).slice(0,ROUND);
  }else{
    var n=parseInt(S.mission,10);
    // 11 possible multipliers (2..12), drop one at random -> 10 questions, no repeats
    var mult=shuffle(range(LOW,HIGH)).slice(0,ROUND);
    for(k=0;k<mult.length;k++) pairs.push([n,mult[k]]);
  }
  return pairs.map(function(p){
    var a=p[0], b=p[1];
    if(S.flip && Math.random()<0.5){ var t=a; a=b; b=t; }
    return {a:a, b:b, ans:a*b, key:factKey(a,b), got:null, ok:false, ms:0};
  });
}

/* ---------- launch pad ---------- */
function paintTables(){
  var wrap=el('tables'); wrap.innerHTML='';
  function add(val,label,mini,wide,twelve){
    var b=document.createElement('button');
    b.className='tbtn'+(wide?' wide':'')+(twelve?' twelve':'');
    b.type='button';
    b.setAttribute('aria-pressed', String(S.mission===val));
    b.dataset.v=val;
    b.innerHTML=label+(mini?'<span class="mini">'+mini+'</span>':'');
    b.addEventListener('click',function(){
      S.mission=val; SFX.tap(); paintTables(); paintNail();
    });
    wrap.appendChild(b);
  }
  for(var n=2;n<=12;n++){
    var bestK=DB.best[String(n)];
    add(String(n), '&times;'+n, bestK?'BEST '+bestK.acc+'%':'', false, n===12);
  }
  var rb=DB.best['random'], bb=DB.best['boss'];
  add('random','&#127756; RANDOM MIX', rb?'BEST '+rb.acc+'%':'ALL TABLES', true);
  add('boss','&#128128; BOSS MIX', bb?'BEST '+bb.acc+'%':'6 7 8 9 11 12', true);
}

function paintNail(){
  var box=el('nail'); box.innerHTML='';
  var arr=[];
  for(var k in DB.errs){ if(DB.errs[k]>0) arr.push([k,DB.errs[k]]); }
  arr.sort(function(x,y){ return y[1]-x[1]; });
  if(!arr.length){
    var c=document.createElement('span');
    c.className='nailchip clean';
    c.textContent=Object.keys(DB.seen).length ? 'Nothing missed yet. Nice flying.' : 'Fly a mission and your tricky facts land here.';
    box.appendChild(c);
    return;
  }
  arr.slice(0,6).forEach(function(p){
    var parts=p[0].split('x');
    var c=document.createElement('span');
    c.className='nailchip';
    c.textContent=parts[0]+' × '+parts[1]+' = '+(parts[0]*parts[1])+'  ×'+p[1];
    box.appendChild(c);
  });
}

function toggle(id,prop){
  var b=el(id);
  b.setAttribute('aria-pressed', String(S[prop]));
  b.addEventListener('click',function(){
    S[prop]=!S[prop];
    b.setAttribute('aria-pressed', String(S[prop]));
    if(prop==='sound'){ if(S.sound){ AC=null; SFX.tap(); } }
    else SFX.tap();
  });
}

/* ---------- keypad ---------- */
function buildPad(){
  var pad=el('pad'); pad.innerHTML='';
  var keys=['1','2','3','4','5','6','7','8','9','del','0','go'];
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.type='button';
    b.className='key'+(k==='del'?' del':'')+(k==='go'?' go':'');
    b.innerHTML = k==='del' ? '&#9003;' : (k==='go' ? 'GO' : k);
    b.setAttribute('aria-label', k==='del'?'Delete':(k==='go'?'Submit answer':k));
    b.dataset.k=k;
    b.addEventListener('click',function(){ press(k); });
    pad.appendChild(b);
  });
}
function press(k){
  if(S.locked) return;
  if(k==='del'){ if(S.entry){ S.entry=S.entry.slice(0,-1); SFX.del(); paintEq(); } return; }
  if(k==='go'){ submit(); return; }
  if(S.entry.length>=3) return;
  if(S.entry==='0') S.entry='';
  S.entry+=k; SFX.tap(); paintEq();
}
document.addEventListener('keydown',function(e){
  if(!el('s-play').classList.contains('on')) return;
  if(e.key>='0'&&e.key<='9') press(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); press('del'); }
  else if(e.key==='Enter'){ e.preventDefault(); press('go'); }
});

/* ---------- mission ---------- */
function startRound(fixOnly){
  if(fixOnly && fixOnly.length){
    S.fixing=true;
    S.qs=fixOnly.map(function(q){ return {a:q.a,b:q.b,ans:q.ans,key:q.key,got:null,ok:false,ms:0}; });
  }else{
    S.fixing=false;
    S.qs=buildRound();
  }
  S.i=0; S.entry=''; S.score=0; S.correct=0; S.streak=0; S.best=0; S.elapsed=0; S.locked=false;
  paintPips();
  el('fuse').classList.toggle('on', S.turbo && !S.fixing);
  screenTo('play');
  SFX.launch();
  nextQ();
}

function paintPips(){
  var p=el('pips'); p.innerHTML='';
  for(var k=0;k<S.qs.length;k++){
    var d=document.createElement('div');
    d.className='pip'+(k<S.i ? (S.qs[k].ok?' ok':' no') : (k===S.i?' now':''));
    p.appendChild(d);
  }
}
function paintHud(){
  el('hScore').textContent=S.score;
  el('hStreak').textContent=S.streak;
  el('hStreakBox').classList.toggle('hot', S.streak>=3);
  var done=S.i;
  el('hAcc').textContent = done ? Math.round(S.correct/done*100)+'%' : '—';
}
function paintEq(){
  var q=S.qs[S.i]; if(!q) return;
  var shown = S.entry==='' ? '<span class="caret"></span>' : S.entry;
  el('eq').innerHTML =
    '<span>'+q.a+'</span><span class="x">&times;</span><span>'+q.b+'</span>'+
    '<span class="x">=</span><span class="slot'+(S.entry===''?' empty':'')+'" id="slot">'+shown+'</span>';
}

function nextQ(){
  if(S.i>=S.qs.length){ finish(); return; }
  S.entry=''; S.locked=false;
  el('msg').className='msg'; el('msg').innerHTML='';
  el('port').className='port chamf-all';
  paintEq(); paintPips(); paintHud();
  S.startedAt=Date.now();
  if(S.turbo && !S.fixing) runFuse();
}

function runFuse(){
  clearTimer();
  var LIMIT=6000, bar=el('fuseBar'), t0=Date.now(), warned=false;
  S.timer=setInterval(function(){
    var left=LIMIT-(Date.now()-t0);
    if(left<=0){ clearTimer(); bar.style.transform='scaleX(0)'; timeOut(); return; }
    bar.style.transform='scaleX('+(left/LIMIT)+')';
    if(left<2000 && !warned){ warned=true; SFX.tick(); }
  },50);
}
function clearTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }

function timeOut(){
  if(S.locked) return;
  resolve(false, null, 6000, true);
}

function submit(){
  if(S.locked) return;
  if(S.entry==='') return;
  var q=S.qs[S.i];
  var val=parseInt(S.entry,10);
  var ms=Date.now()-S.startedAt;
  clearTimer();
  resolve(val===q.ans, val, ms, false);
}

function resolve(ok, val, ms, ranOut){
  S.locked=true;
  var q=S.qs[S.i];
  q.got=val; q.ok=ok; q.ms=ms;
  S.elapsed+=ms;

  var port=el('port'), msg=el('msg');

  if(ok){
    S.correct++; S.streak++;
    if(S.streak>S.best) S.best=S.streak;
    var speedBonus = ms<3000 ? 50 : (ms<6000 ? 25 : 0);
    var streakBonus = Math.min(S.streak-1,5)*20;
    S.score += 100 + speedBonus + streakBonus;
    if(!S.fixing) DB.seen[q.key]=(DB.seen[q.key]||0)+1;
    if(!S.fixing && DB.errs[q.key]) { DB.errs[q.key]--; if(DB.errs[q.key]<=0) delete DB.errs[q.key]; }
    port.className='port chamf-all good';
    msg.className='msg good';
    msg.innerHTML=pick(['NAILED IT!','BOOM!','ON TARGET!','LOCKED IN!','TOO EASY!','SHARP!'])+
      (speedBonus===50?'<span class="why">Lightning bonus +50</span>':'');
    if(S.streak>=3){ el('combo').textContent='×'+S.streak+' STREAK'; el('combo').className='combo show';
      setTimeout(function(){ el('combo').className='combo'; },820); }
    SFX.good(S.streak); buzz(20);
  }else{
    S.streak=0;
    if(!S.fixing){ DB.seen[q.key]=(DB.seen[q.key]||0)+1; DB.errs[q.key]=(DB.errs[q.key]||0)+1; }
    port.className='port chamf-all bad';
    msg.className='msg bad';
    msg.innerHTML=(ranOut?'OUT OF TIME':'NOT QUITE')+
      '<span class="fact">'+q.a+' × '+q.b+' = '+q.ans+'</span>'+
      '<span class="why">'+hint(q)+'</span>';
    SFX.bad(); buzz([30,40,30]);
  }

  paintHud();
  if(!S.fixing) save();
  setTimeout(function(){ S.i++; nextQ(); }, ok?700:2100);
}

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* A single anchoring strategy per fact - the kind of thing a
   Year 4 teacher says out loud, not a generic "try again". */
function hint(q){
  var a=Math.min(q.a,q.b), b=Math.max(q.a,q.b);
  if(b===12) return a+' \u00D7 10 = '+(a*10)+', plus '+a+' \u00D7 2 = '+(a*2);
  if(b===11) return (a<10 ? 'Elevens double up: '+a+a : a+' \u00D7 10 = '+(a*10)+', plus another '+a);
  if(b===10) return 'Ten times: put a zero after the '+a;
  if(b===9)  return a+' \u00D7 10 = '+(a*10)+', take away '+a;
  if(b===8)  return 'Double '+a+' three times: '+(a*2)+', '+(a*4)+', '+(a*8);
  if(b===7)  return a+' \u00D7 5 = '+(a*5)+', plus '+a+' \u00D7 2 = '+(a*2);
  if(b===6)  return a+' \u00D7 3 = '+(a*3)+', then double it';
  if(b===5)  return 'Half of '+a+' \u00D7 10, so half of '+(a*10);
  if(b===4)  return 'Double '+a+' twice: '+(a*2)+', then '+(a*4);
  if(b===3)  return a+' + '+a+' + '+a;
  return 'Double '+a+', which is '+(a*2);
}

/* ---------- debrief ---------- */
var RANKS=[
  {min:10, badge:'\u{1F451}', title:'GALAXY LEGEND', line:'Ten from ten. That table belongs to you now.'},
  {min:9,  badge:'\u{1F680}', title:'STAR COMMANDER', line:'One slip, that is all. Brilliant flying.'},
  {min:8,  badge:'\u{1F6F8}', title:'FLIGHT ACE', line:'Strong round. Two facts to tidy up.'},
  {min:6,  badge:'\u{1F9D1}\u200D\u{1F680}', title:'ASTRONAUT', line:'Solid. Run the Fix-It round, then fly it again.'},
  {min:4,  badge:'\u{1F6E0}\uFE0F', title:'CADET', line:'Getting there. Same table again and it will click.'},
  {min:0,  badge:'\u{1F6F0}\uFE0F', title:'ROOKIE PILOT', line:'Tricky one. Fix the missed facts, then fly it again.'}
];

function finish(){
  clearTimer();
  var total=S.qs.length;
  var acc=Math.round(S.correct/total*100);
  var avg=(S.elapsed/total/1000);

  el('dAcc').textContent=acc+'%';
  el('dScore').textContent=S.score;
  el('dSpeed').textContent=avg.toFixed(1)+'s';

  var r=RANKS[0];
  for(var k=0;k<RANKS.length;k++){ if(S.correct>=RANKS[k].min){ r=RANKS[k]; break; } }
  el('dBadge').textContent=r.badge;
  el('dTitle').textContent=S.fixing?'FIX-IT COMPLETE':r.title;
  el('dLine').textContent=S.fixing
    ? 'Practice round — this one does not count towards your best score.'
    : r.line + (S.best>=4 ? '  Longest streak: \u00D7'+S.best+'.' : '');

  // best score, per mission
  var bestEl=el('dBest');
  bestEl.hidden=true;
  if(!S.fixing){
    var cur=DB.best[S.mission];
    var better = !cur || acc>cur.acc || (acc===cur.acc && S.score>cur.score);
    if(better){
      DB.best[S.mission]={acc:acc, score:S.score};
      bestEl.hidden=false;
      bestEl.textContent='⭐ NEW STATION RECORD FOR '+missionName()+' ⭐';
      SFX.fanfare();
    }
    save();
  }

  var missed=S.qs.filter(function(q){ return !q.ok; });
  el('dListHead').textContent = missed.length ? 'Facts to fix ('+missed.length+')' : 'Mission log — all clear';
  var list=el('dList'); list.innerHTML='';
  (missed.length?missed:S.qs).forEach(function(q){
    var row=document.createElement('div');
    row.className='rrow'+(q.ok?'':' miss');
    row.innerHTML='<span class="tick">'+(q.ok?'✅':'❌')+'</span>'+
      '<span class="q">'+q.a+' × '+q.b+' = '+q.ans+'</span>'+
      (q.ok?'<span class="got">'+(q.ms/1000).toFixed(1)+'s</span>'
           :'<span class="got">you said '+(q.got===null?'—':q.got)+'</span>');
    list.appendChild(row);
  });

  var fix=el('fixit');
  if(missed.length){ fix.hidden=false; fix.textContent='FIX THE '+missed.length+' MISSED '+(missed.length===1?'FACT':'FACTS'); }
  else { fix.hidden=true; if(!S.fixing) SFX.fanfare(); }
  S._missed=missed;

  paintTables(); paintNail();
  screenTo('done');
  el('s-done').querySelector('.homescroll').scrollTop=0;
}

function missionName(){
  if(S.mission==='random') return 'RANDOM MIX';
  if(S.mission==='boss') return 'BOSS MIX';
  return 'THE '+S.mission+' TIMES TABLE';
}

/* ---------- wiring ---------- */
paintTables(); paintNail(); buildPad();
toggle('opt-turbo','turbo'); toggle('opt-flip','flip'); toggle('opt-sound','sound');

el('launch').addEventListener('click',function(){ startRound(null); });
el('again').addEventListener('click',function(){ startRound(null); });
el('fixit').addEventListener('click',function(){ startRound(S._missed); });
el('home').addEventListener('click',function(){ clearTimer(); SFX.tap(); screenTo('home'); });
el('abort').addEventListener('click',function(){ clearTimer(); S.locked=true; screenTo('home'); });

/* keep the console from bouncing on iOS */
document.addEventListener('touchmove',function(e){
  if(!e.target.closest('.homescroll')) e.preventDefault();
},{passive:false});

})();
</script>
